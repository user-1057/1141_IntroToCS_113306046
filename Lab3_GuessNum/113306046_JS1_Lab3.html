<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>113306046 Number Guessing Game</title>
</head>
<body>

<h1>113306046 Number Guessing Game</h1>
<div id="resultArea"></div>

<script>
var answer = Math.floor(Math.random() * 100) + 1;
var chances = 7;

var low = 1;
var high = 100;

while (chances > 0) {
    var input = window.prompt(
        "請輸入1到100之間的整數 (" + low + " ~ " + high + ")\n你還有" + chances + "次機會"
    );

    if (input === null) {
        alert("取消遊戲");
        break;
    }

    input = input.trim();

    if (input === "" || isNaN(input)) {
        alert("請輸入有效範圍內的數字（不能超出1到100）！");
        continue;
    }

    var guess = Number(input);

    if (guess < low || guess > high) {
        alert("請輸入有效範圍內的數字（不能超出1到100）！");
        continue;
    }

    if (guess === answer) {
        alert("恭喜你答對了！正確答案是" + answer);
        document.getElementById("resultArea").innerHTML =
            '<img src="images/correct.png" width="500">';
        break;
    }

    if (guess < answer) {
        low = guess + 1;
    } else {
        high = guess - 1;
    }

    chances--;
}

if (chances === 0) {
    alert("答案是：" + answer);
    document.getElementById("resultArea").innerHTML =
        '<img src="images/wrong.png" width="500">';
}

    






</script>

</body>
</html>
