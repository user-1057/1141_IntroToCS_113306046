<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HW8 Calculator</title>
  <link rel="stylesheet" href="113306046_JS2_HW8.css">
</head>
<body>

  <h2>JS Calculator</h2>

  <div class="calculator">
    <input type="number" id="num1" placeholder="Number 1">
    
    <select id="operator">
      <option value="+">+</option>
      <option value="-">-</option>
      <option value="*">*</option>
      <option value="/">/</option>
    </select>

    <input type="number" id="num2" placeholder="Number 2">

    <button id="calcBtn">確認</button>

    <p id="result">Result: </p>
  </div>

  <script src="113306046_JS2_HW8.js"></script>
</body>
</html>
