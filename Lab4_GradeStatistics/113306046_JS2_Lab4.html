<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grade Statistics</title>
    <link rel="stylesheet" href="113306046_JS2_Lab4.css">
</head>
<body>

<input type="number" id="mathInput" class="input-box" placeholder="Math">
<input type="number" id="engInput" class="input-box" placeholder="English">
<button id="submitBtn">Submit</button>

<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Math</th>
            <th>English</th>
            <th>Average</th>
        </tr>
    </thead>

    <tbody id="tableBody"></tbody>

    <tfoot>
        <tr>
            <td>Average</td>
            <td id="mathAvg">-</td>
            <td id="engAvg">-</td>
            <td id="overallAvg">-</td>
        </tr>
    </tfoot>
</table>

<script src="113306046_JS2_Lab4.js"></script>
</body>
</html>
